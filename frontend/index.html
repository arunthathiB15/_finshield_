<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="shell-type" content="mobile_tab" />
    <title>FinShield QUANT — Institutional Quantitative Terminal</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind CSS with Quantitative Theme Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#0f131d",
              "surface": "#0f131d",
              "surface-dim": "#0f131d",
              "surface-bright": "#353944",
              "surface-variant": "#313540",
              "surface-container-lowest": "#0a0e18",
              "surface-container-low": "#171b26",
              "surface-container": "#1c1f2a",
              "surface-container-high": "#262a35",
              "surface-container-highest": "#313540",
              "primary": "#dbfcff",
              "primary-container": "#00f0ff",
              "primary-fixed": "#7df4ff",
              "primary-fixed-dim": "#00dbe9",
              "on-primary": "#00363a",
              "on-primary-container": "#006970",
              "secondary": "#ffb1c5",
              "secondary-container": "#e30071",
              "secondary-fixed": "#ffd9e1",
              "secondary-fixed-dim": "#ffb1c5",
              "on-secondary": "#65002f",
              "on-secondary-container": "#fffbff",
              "tertiary": "#f8f4ff",
              "tertiary-container": "#d7d6ff",
              "tertiary-fixed": "#e1e0ff",
              "tertiary-fixed-dim": "#c0c1ff",
              "outline": "#849495",
              "outline-variant": "#3b494b",
              "on-surface": "#dfe2f1",
              "on-surface-variant": "#b9cacb",
              "error": "#ffb4ab",
              "error-container": "#93000a",
              "on-error": "#690005",
              "on-error-container": "#ffdad6",

              /* Liquid Glass Light Tokens */
              "text-obsidian": "#0F172A",
              "text-slate": "#1E293B",
              "text-muted": "#475569",
              "text-faint": "#94A3B8",
              "alpha-positive": "#059669",
              "stress-negative": "#E11D48",
              "glass-surface": "rgba(255, 255, 255, 0.78)",
              "glass-border": "rgba(255, 255, 255, 0.92)",
              "glass-subtle": "rgba(248, 250, 252, 0.65)"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "2xl": "1rem",
              "full": "9999px"
            },
            spacing: {
              "space-xs": "0.125rem",
              "space-sm": "0.25rem",
              "space-md": "0.5rem",
              "space-lg": "0.75rem",
              "space-xl": "1rem",
              "margin": "0.75rem",
              "margin-mobile": "0.5rem"
            },
            fontFamily: {
              "headline-xl": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"],
              "display-lg": ["Inter", "sans-serif"],
              "metric-lg": ["JetBrains Mono", "monospace"],
              "metric-md": ["JetBrains Mono", "monospace"],
              "metric-sm": ["JetBrains Mono", "monospace"],
              "metric-xl": ["JetBrains Mono", "monospace"],
              "code-sm": ["JetBrains Mono", "monospace"],
              "label-caps": ["JetBrains Mono", "monospace"]
            },
            fontSize: {
              "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.005em", fontWeight: "400" }],
              "body-md": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }],
              "body-lg": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
              "headline-sm": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "600" }],
              "headline-md": ["16px", { lineHeight: "22px", letterSpacing: "-0.005em", fontWeight: "600" }],
              "headline-lg": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "headline-xl": ["24px", { lineHeight: "30px", letterSpacing: "-0.015em", fontWeight: "600" }],
              "display-lg": ["32px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "metric-sm": ["12px", { lineHeight: "16px", letterSpacing: "-0.01em", fontWeight: "500" }],
              "metric-md": ["14px", { lineHeight: "18px", letterSpacing: "-0.02em", fontWeight: "500" }],
              "metric-lg": ["20px", { lineHeight: "24px", letterSpacing: "-0.03em", fontWeight: "600" }],
              "code-sm": ["11px", { lineHeight: "16px", letterSpacing: "0em", fontWeight: "400" }],
              "label-caps": ["10px", { lineHeight: "14px", letterSpacing: "0.06em", fontWeight: "600" }]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container antialiased">
    <div id="root" class="flex flex-col min-h-screen w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
